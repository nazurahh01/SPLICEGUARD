<!DOCTYPE html>
<html>
<head>
    <title>User Management</title>
</head>
<body>

<h1>User Management</h1>

<table border="1" cellpadding="10">

    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th>Subscription</th>
        <th>Expiry</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>{{ user.status }}</td>
        <td>{{ user.subscription_type }}</td>
        <td>{{ user.subscription_expiry }}</td>
    </tr>
    {% endfor %}

</table>

<br>

<a href="/admin">Back to Admin Dashboard</a>

</body>
</html>
